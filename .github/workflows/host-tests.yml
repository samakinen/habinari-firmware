#
# Two jobs. host-tests builds and runs the portable parts of the firmware on the
# runner: no ESP-IDF and no hardware, so it stays fast enough to gate every
# push. firmware builds every image tools/build_variants.sh knows, so a change
# that breaks one personality's configuration (or pushes knxip out of its
# partition) fails here rather than on someone's desk.
#
# The KNX stack's own suite (host CTest, sanitisers, interop) runs in the
# KNstaX repository's CI, not here.

name: host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      # components/KNstaX is needed even here: main/test builds against its
      # minimal Unity header, so a checkout without it fails to compile.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # mbedcrypto, for the device root secret KDF. Everything else the tests
      # need is already on the image.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev

      - name: Configure
        run: cmake -S main/test -B build_host_tests

      - name: Build
        run: cmake --build build_host_tests -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build_host_tests --output-on-failure

  firmware:
    name: firmware (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # The README's reference version. Keep it in step with what the project is
    # developed against: KNstaX's IP Secure split depends on the mbedTLS major
    # the IDF ships, so a different IDF builds a different image.
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        variant: [knx, knxip, modbus, modbus-ble, mqtt]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The ETS export is a nested host build with its own compiler
      # requirements; it is not what this job checks.
      - name: Build
        shell: bash
        env:
          HABINARI_ETS_EXPORT: "OFF"
        run: |
          . "$IDF_PATH/export.sh"
          tools/build_variants.sh ${{ matrix.variant }}
