#
# Builds and runs the portable parts of the firmware on the runner. No ESP-IDF
# and no hardware, so it stays fast enough to gate every push.
#
# components/KNstaX is public now, so a target build is worth adding as a second
# job:
#
#   firmware:
#     runs-on: ubuntu-latest
#     container: espressif/idf:release-v5.5
#     steps:
#       - uses: actions/checkout@v4
#         with: { submodules: recursive }
#       - run: . $IDF_PATH/export.sh && idf.py set-target esp32c6 build
#
# It is left out only because it is slower than the gate this file is meant to
# be, not because anything blocks it.

name: host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      # components/KNstaX is needed even here: main/test builds against its
      # minimal Unity header, so a checkout without it fails to compile.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # mbedcrypto, for the device root secret KDF. Everything else the tests
      # need is already on the image.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev

      - name: Configure
        run: cmake -S main/test -B build_host_tests

      - name: Build
        run: cmake --build build_host_tests -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build_host_tests --output-on-failure
